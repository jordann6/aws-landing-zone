name: TTL guard

# Hourly watch for a forgotten teardown (ADR-0004). In check_only mode it reads
# live state and fails if any hourly-billed resource is standing; the red
# scheduled run and its notification are the alarm. It changes nothing and uses
# the read-scoped gha-plan role. It runs whether or not HOURLY_STACK_ENABLED is
# true on purpose: while the stack is up, each hour of red is an hour of spend.
#
# Only the roots that can hold hourly resources are watched. delivery holds ECR,
# DynamoDB and IAM, none of which bill by the hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ttl:
    strategy:
      fail-fast: false
      matrix:
        root: [network, workload]
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-destroy.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      terraform_dir: ${{ matrix.root }}
      aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
      aws_region: us-east-1
      check_only: true
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
