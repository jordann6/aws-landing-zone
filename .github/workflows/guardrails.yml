name: Guardrails

on:
  push:
    branches: [main]
  pull_request:

# The static half is credential-free by design. Everything in the `static` job
# runs analysis over Terraform that, on a pull_request event, was authored by
# whoever opened the PR, so nothing here holds a permission that can mint a
# cloud token. The credentialed `plan` job below carries its own scoped
# permissions on the job, never at file level.
# Version pins: every reusable-workflow call in this repo (here, apply.yml,
# destroy.yml and ttl-guard.yml) pins platform-guardrails to one commit SHA with
# the tag in a comment, and passes the same SHA as guardrails_ref so the scripts
# and policies it checks out match the reviewed workflow. v1.7.0 adds the
# ephemeral TF_VAR_ci_stage hand-off and has_changes (ADR-0004); v1.7.1 makes
# has_changes report correctly (setup-terraform wrapper off).
permissions:
  contents: read

jobs:
  static:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: terraform
      # No baseline: this repo's static gates are green as-is. Add one only if a
      # future change introduces findings that must be ratcheted down over time:
      # checkov_baseline: .checkov.baseline

  # The accounts/ root holds the persistent org, OUs, accounts, and SCPs.
  static_accounts:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: accounts

  # The bootstrap/ root: CI OIDC roles and the dedicated state backend (ADR-0003).
  static_bootstrap:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: bootstrap

  # The network/ root is a separate root module (the timed inspection layer), so
  # it gets its own static gate.
  static_network:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: network

  # The workload/ root is the paved-road prod tier (data + EKS), also timed.
  static_workload:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: workload

  # The delivery/ root: release-guard's registries, deployment table and release
  # and workload identities. No hourly resources.
  static_delivery:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: delivery

  # The observability/ root: finding routing, the OAM monitoring account, and
  # the central alarms.
  static_observability:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: observability

  # The compute/ root: the hardened management instance from the golden AMI.
  static_compute:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: compute

  # The secrets/ root: metadata-only scan-target roles for the secrets scanner.
  static_secrets:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: secrets

  # The incident/ root: per-step forensics target roles in prod, the alarm
  # reader in shared-services, and the responder's private n8n repository.
  static_incident:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: incident

  # The uptime/ root: a 5-minute website check with metrics and alarms in the monitoring account.
  static_uptime:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: uptime

  # The backup-verify/ root: a versioned backup bucket and its daily freshness check.
  static_backup_verify:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: backup-verify

  # The remediation/ root: a tag-scoped, circuit-broken reboot Lambda in the prod account.
  static_remediation:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
      terraform_dir: remediation

  # Behavior tests for the three standing roots' Lambdas and the workload's rotation
  # package. Credential-free: AWS clients are stubbed, DynamoDB is an in-memory fake,
  # and PostgreSQL is stubbed behind the real psycopg2 (pinned like the package).
  python_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet boto3 pytest psycopg2-binary==2.9.13
      - run: python -m pytest uptime/tests backup-verify/tests remediation/tests workload/rotation/tests -q

  # The FinOps allocation policy (CostCenter) already runs inside `static`, since
  # tf-ci.yml evaluates the whole shared policy/ set. These jobs add the cost
  # *threshold*: a PR that raises a billable root's projected monthly cost by more
  # than max_monthly_increase fails unless labeled cost-approved. One job per
  # root that bills; the governance root is effectively free.
  # The local cost workflow keeps hosted example policies out of enforcement;
  # allocation is still enforced by every shared static job above.
  finops_network:
    uses: ./.github/workflows/finops-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      terraform_dir: network
      max_monthly_increase: "50"
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  finops_workload:
    uses: ./.github/workflows/finops-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      terraform_dir: workload
      max_monthly_increase: "50"
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  finops_delivery:
    uses: ./.github/workflows/finops-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      terraform_dir: delivery
      max_monthly_increase: "50"
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  finops_observability:
    uses: ./.github/workflows/finops-gate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      terraform_dir: observability
      max_monthly_increase: "50"
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  # ---- Credentialed plan (ADR-0004) ------------------------------------------
  # Pull requests only. On main the apply workflow plans, and a second plan here
  # would contend for the same state lock. Permissions sit on each job, never at
  # file level, so the static jobs can never mint an OIDC token.
  #
  # Each hourly root depends on the one before it (workload reads network state,
  # delivery reads workload state), so a root is planned only when its upstream
  # state holds resources. Otherwise its plan cannot be computed, and the job is
  # skipped with a notice instead of failing.
  upstream:
    name: Upstream state
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      network: ${{ steps.state.outputs.network }}
      workload: ${{ steps.state.outputs.workload }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::692859913278:role/gha-plan
          aws-region: us-east-1
      - id: state
        # Fail closed: an unreadable state fails this job rather than reading as
        # empty and silently skipping a plan. Every root's state object exists,
        # empty after a destroy.
        run: |
          set -o pipefail
          for root in network workload; do
            count=$(aws s3 cp "s3://jordann6-aws-landing-zone-tfstate/aws-landing-zone/$root.tfstate" - \
              | jq '[.resources[]? | select(.mode == "managed")] | length')
            if [ "$count" -gt 0 ]; then live=true; else live=false; fi
            echo "$root=$live" >> "$GITHUB_OUTPUT"
            echo "$root state: $count managed resources (live=$live)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$live" = false ]; then
              echo "::notice::$root state is empty, so the roots that read it are not planned on this PR."
            fi
          done

  plan_network:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      terraform_dir: network
      aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
      aws_region: us-east-1
      enable_infracost: false
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84

  plan_workload:
    needs: upstream
    if: github.event_name == 'pull_request' && needs.upstream.outputs.network == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      terraform_dir: workload
      aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
      aws_region: us-east-1
      enable_infracost: false
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84

  plan_delivery:
    needs: upstream
    if: github.event_name == 'pull_request' && needs.upstream.outputs.workload == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@24e7f31e26b1243dd367544310259a47c9d37e84 # v1.7.1
    with:
      terraform_dir: delivery
      aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
      aws_region: us-east-1
      enable_infracost: false
      guardrails_ref: 24e7f31e26b1243dd367544310259a47c9d37e84
