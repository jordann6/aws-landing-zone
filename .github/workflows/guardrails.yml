name: Guardrails

on:
  push:
    branches: [main]
  pull_request:

# The static half is credential-free by design. Everything in the `static` job
# runs analysis over Terraform that, on a pull_request event, was authored by
# whoever opened the PR, so nothing here holds a permission that can mint a
# cloud token. The credentialed `plan` job below carries its own scoped
# permissions on the job, never at file level.
# Version pins: every reusable-workflow pin in this repo (tf-ci here, the
# commented tf-plan + finops-gate, and apply/destroy/ttl-guard in their own
# files) references v1.4.0 (v1.3.0 added the gated apply/destroy/ttl-guard
# workflows; v1.4.0 adds optional GCP inputs only, so no input changes here).
permissions:
  contents: read

jobs:
  static:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.4.0
    with:
      terraform_dir: terraform
      # No baseline: this repo's static gates are green as-is. Add one only if a
      # future change introduces findings that must be ratcheted down over time:
      # checkov_baseline: .checkov.baseline

  # The accounts/ root holds the persistent org, OUs, accounts, and SCPs.
  static_accounts:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.4.0
    with:
      terraform_dir: accounts

  # The network/ root is a separate root module (the timed inspection layer), so
  # it gets its own static gate.
  static_network:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.4.0
    with:
      terraform_dir: network

  # The workload/ root is the paved-road prod tier (data + EKS), also timed.
  static_workload:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.4.0
    with:
      terraform_dir: workload

  # The observability/ root: finding routing, the OAM monitoring account, and
  # the central alarms.
  static_observability:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.4.0
    with:
      terraform_dir: observability

  # The FinOps allocation policy (CostCenter) already runs inside `static`, since
  # tf-ci.yml evaluates the whole shared policy/ set. These jobs add the cost
  # *threshold*: a PR that raises a billable root's projected monthly cost by more
  # than max_monthly_increase fails unless labeled cost-approved. One job per
  # root that bills; the governance root is effectively free.
  finops_network:
    uses: jordann6/platform-guardrails/.github/workflows/finops-gate.yml@v1.4.0
    permissions:
      contents: read
      pull-requests: write
    with:
      terraform_dir: network
      max_monthly_increase: "50"
      fail_on_cost: true
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  finops_workload:
    uses: jordann6/platform-guardrails/.github/workflows/finops-gate.yml@v1.4.0
    permissions:
      contents: read
      pull-requests: write
    with:
      terraform_dir: workload
      max_monthly_increase: "50"
      fail_on_cost: true
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  finops_observability:
    uses: jordann6/platform-guardrails/.github/workflows/finops-gate.yml@v1.4.0
    permissions:
      contents: read
      pull-requests: write
    with:
      terraform_dir: observability
      max_monthly_increase: "50"
      fail_on_cost: true
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  # Credentialed read: plan + destroy guard + cost diff, OIDC only.
  # The gha-plan role now exists and its ARN is filled in below. ACTIVATE by
  # uncommenting to run a credentialed plan on every PR/push. Permissions sit on
  # the job, never hoisted to file level, so the static job can never hold an
  # OIDC token.
  #
  # plan:
  #   permissions:
  #     contents: read
  #     id-token: write
  #     pull-requests: write
  #   uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@v1.4.0
  #   with:
  #     terraform_dir: terraform
  #     aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
  #     aws_region: us-east-1
  #     enable_infracost: false
  #   secrets:
  #     INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
