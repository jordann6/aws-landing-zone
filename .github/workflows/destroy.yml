name: Destroy (manual teardown)

# Manual teardown: terraform destroy, then a post-destroy check that fails if any
# hourly-billed resource survived (the section-8 teardown verification). Gated by
# the `destroy` environment so a teardown is a recorded, approved act.
#
# This destroys the governance root only. The org, OUs, member accounts, and SCPs
# live in the persistent accounts/ root, which no workflow destroys, so every
# account stays ACTIVE (none left SUSPENDED holding quota and email aliases).
#
# INACTIVE until Phase-1 activation:
#   1. bootstrap role applied (gha-apply, which has destroy rights)
#   2. platform-guardrails v1.4.0 pushed
#   3. a `destroy` GitHub environment with a required reviewer
#   4. 692859913278 replaced below
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-destroy.yml@v1.4.0
    with:
      terraform_dir: terraform
      environment: destroy
      aws_role_arn: arn:aws:iam::692859913278:role/gha-apply
      aws_region: us-east-1
      check_only: false
