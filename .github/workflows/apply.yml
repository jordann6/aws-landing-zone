name: Apply (gated)

# Reviewer-gated apply for the hourly roots (ADR-0004), in dependency order:
# network, then workload (reads network state), then delivery (reads workload
# state). For each root, tf-apply plans read-only with gha-plan, runs the destroy
# guard, saves the plan, then pauses on the `prod-apply` environment and replays
# that exact saved plan with the write-scoped gha-apply role. An empty plan skips
# the gated job, so nobody is asked to approve a no-op.
#
# After the last apply, every root is planned again and must come back empty.
# A second plan with changes means a perpetual diff (a provider normalising a
# value the config keeps resetting), and that fails the run the day it appears.
#
# HOURLY_STACK_ENABLED (repo variable) is the desired state of the hourly stack.
# While it is not "true", a merge never pages a reviewer to build ~$1.16/hour of
# infrastructure. To bring the stack up: set it to true, then dispatch this
# workflow on main. To take it down: run destroy.yml, then set it to false.
#
# The governance root (terraform/) and the persistent roots (accounts/,
# bootstrap/, observability/) stay operator-applied; see ADR-0004.
on:
  push:
    branches: [main]
    paths:
      - network/**
      - workload/**
      - delivery/**
  workflow_dispatch:

# Apply and destroy never interleave, and a queued run waits instead of
# cancelling one that is mid-apply.
concurrency:
  group: aws-landing-zone-hourly-stack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  network:
    if: vars.HOURLY_STACK_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-apply.yml@4447265297e54d66d567bf3d894ee9a60c8b1bc1 # v1.7.2
    with:
      terraform_dir: network
      environment: prod-apply
      plan_role_arn: arn:aws:iam::692859913278:role/gha-plan
      apply_role_arn: arn:aws:iam::692859913278:role/gha-apply
      aws_region: us-east-1
      skip_apply_when_unchanged: true
      guardrails_ref: 4447265297e54d66d567bf3d894ee9a60c8b1bc1

  workload:
    needs: network
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-apply.yml@4447265297e54d66d567bf3d894ee9a60c8b1bc1 # v1.7.2
    with:
      terraform_dir: workload
      environment: prod-apply
      plan_role_arn: arn:aws:iam::692859913278:role/gha-plan
      apply_role_arn: arn:aws:iam::692859913278:role/gha-apply
      aws_region: us-east-1
      skip_apply_when_unchanged: true
      guardrails_ref: 4447265297e54d66d567bf3d894ee9a60c8b1bc1

  # The deployment contract is not published here: release-guard reads it from
  # SSM in the prod account, and these jobs hold management-account credentials.
  # Publishing stays an operator step while DELIVERY_ENABLED is false (ADR-0004).
  delivery:
    needs: workload
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-apply.yml@4447265297e54d66d567bf3d894ee9a60c8b1bc1 # v1.7.2
    with:
      terraform_dir: delivery
      environment: prod-apply
      plan_role_arn: arn:aws:iam::692859913278:role/gha-plan
      apply_role_arn: arn:aws:iam::692859913278:role/gha-apply
      aws_region: us-east-1
      skip_apply_when_unchanged: true
      guardrails_ref: 4447265297e54d66d567bf3d894ee9a60c8b1bc1

  # ---- Second plan: must be empty ----------------------------------------------
  replan_network:
    needs: delivery
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@4447265297e54d66d567bf3d894ee9a60c8b1bc1 # v1.7.2
    with:
      terraform_dir: network
      aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
      aws_region: us-east-1
      guardrails_ref: 4447265297e54d66d567bf3d894ee9a60c8b1bc1

  replan_workload:
    needs: delivery
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@4447265297e54d66d567bf3d894ee9a60c8b1bc1 # v1.7.2
    with:
      terraform_dir: workload
      aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
      aws_region: us-east-1
      guardrails_ref: 4447265297e54d66d567bf3d894ee9a60c8b1bc1

  replan_delivery:
    needs: delivery
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@4447265297e54d66d567bf3d894ee9a60c8b1bc1 # v1.7.2
    with:
      terraform_dir: delivery
      aws_role_arn: arn:aws:iam::692859913278:role/gha-plan
      aws_region: us-east-1
      guardrails_ref: 4447265297e54d66d567bf3d894ee9a60c8b1bc1

  no_drift:
    name: Second plan is empty
    needs: [replan_network, replan_workload, replan_delivery]
    runs-on: ubuntu-latest
    steps:
      - env:
          NETWORK: ${{ needs.replan_network.outputs.has_changes }}
          WORKLOAD: ${{ needs.replan_workload.outputs.has_changes }}
          DELIVERY: ${{ needs.replan_delivery.outputs.has_changes }}
        run: |
          status=0
          for pair in "network=$NETWORK" "workload=$WORKLOAD" "delivery=$DELIVERY"; do
            root=${pair%%=*}; changes=${pair#*=}
            echo "$root: has_changes=$changes" >> "$GITHUB_STEP_SUMMARY"
            if [ "$changes" != "false" ]; then
              echo "::error::$root planned changes right after its apply: a perpetual diff, or drift. See the replan_$root job summary."
              status=1
            fi
          done
          exit $status
